name: Build LAN Touchpad APK

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          test -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK 35
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Prepare versioned APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$SRC"
          VERSION=$(grep -oP "versionName\s+['\"]?\K[0-9.]+" android/app/build.gradle | head -n 1)
          SHORT=${GITHUB_SHA::7}
          OUT="LAN-Touchpad-v${VERSION}-${SHORT}-debug.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built $OUT ($(stat -c%s "$OUT") bytes) from $SRC"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Touchpad-v${{ steps.apk.outputs.version }}-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Update latest prerelease (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "最新自动构建 (main)" --notes "由 main 分支自动构建，commit ${GITHUB_SHA}。"
          cp "${{ steps.apk.outputs.path }}" LAN-Touchpad-debug-latest.apk
          gh release upload latest LAN-Touchpad-debug-latest.apk --clobber

      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" "${{ steps.apk.outputs.path }}" \
            --title "LAN Touchpad ${{ github.ref_name }}" \
            --generate-notes
